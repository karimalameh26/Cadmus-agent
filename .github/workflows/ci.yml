name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[files,dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -m pytest
      - name: Build and smoke-test the installed wheel
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          subprocess.run([sys.executable, "-m", "build", "--wheel"], check=True)
          wheel = next(Path("dist").glob("cadmus-*.whl")).resolve()
          examples = Path("examples/json_records").resolve()
          with tempfile.TemporaryDirectory(prefix="cadmus-wheel-") as temporary:
              environment = Path(temporary) / "venv"
              subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
              executable = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(executable), "-m", "pip", "install", f"{wheel}[files]"], check=True)
              subprocess.run([str(executable), "-m", "cadmus", "config", "validate"], cwd=examples, check=True)
              subprocess.run(
                  [str(executable), "-m", "cadmus", "-q", "dataset", "import",
                   "records_batch1.json", "--verified-by", "reviewer-1"],
                  cwd=examples,
                  check=True,
              )
