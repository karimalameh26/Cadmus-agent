# Direct-file mode: the classifier reads actual local files under the allowed roots. No JSON manifest needed.
client_id = "demo-files"
data_dir = ".ag-agent"
reviewers = ["reviewer-1"]

[task]
name = "doc-type"
labels = ["invoice", "receipt", "contract"]
critical_labels = ["contract"]
baseline_guidance = """Classify the document by its business document type.
- If the evidence mentions "invoice", classify as "invoice".
- If the evidence mentions "cashier", classify as "receipt".
- If the evidence mentions "agreement", classify as "contract"."""

[input]
mode = "direct_files"
roots = ["files"]

[input.files]
family_from = "stem"      # invoice_01.pdf and invoice_01.png are one family (never split apart)
expose_filename = false   # file names are identifiers, not model-visible evidence

[documents]
max_pages = 10
oversize_policy = "truncate"
pdf_scan_strategy = "render"   # scanned PDF pages are rendered to images for multimodal models

# The fake provider reads text only. Images and scanned pages need a live multimodal provider, e.g.:
# [provider]
# kind = "openai_compatible"
# base_url = "https://api.openai.com/v1"
# model = "<multimodal model>"
# api_key_env = "OPENAI_API_KEY"
[provider]
kind = "fake"
