[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ag-agent"
version = "0.1.0"
description = "Observable, ground-truth-gated self-improving document/image classification"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
files = ["pillow>=10", "pypdf>=4", "pypdfium2>=4"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "reportlab>=4"]

[project.scripts]
ag-agent = "ag_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["ag_agent"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
